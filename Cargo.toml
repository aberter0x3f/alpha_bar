[package]
name = "alpha_bar"
version = "0.1.0"
edition = "2024"

[dependencies]
cairo-rs = { version = "0.22", features = ["png"] }
chrono = "0.4"
libc = "0.2"
pango = "0.22"
pangocairo = "0.22"
pipewire = "0.10"
resvg = "0.47"
serde_json = "1"
smithay-client-toolkit = "0.20"
system-tray = "0.8"
tokio = { version = "1", features = ["rt-multi-thread"] }
wayland-client = "0.31"
zbus = "5.17"
