[package]
name = "alpha_bar"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
cairo-rs = { version = "0.22", features = ["png"] }
libc = "0.2"
pango = "0.22"
pangocairo = "0.22"
pipewire = "0.10"
resvg = { version = "0.47", default-features = false, features = ["raster-images"] }
serde_json = "1"
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
zbus = "5"
